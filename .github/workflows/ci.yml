name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg (needed by npm test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Syntax check
        run: npm run check
      - name: Offline stream parser test
        run: npm test
